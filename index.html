<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجربة مصرفية صُمّمت لك</title>
<style>
  :root{
    --navy:#0d1447;
    --blue-text:#5865c7;
    --bg:#f6f7fb;
    --card-a:#dde2f7;
    --card-b:#c7cef5;
    --muted:#7c82a3;
    --white:#ffffff;
    --red:#e63946;
    --cyan:#29b6f6;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Tahoma","Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--navy);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- top notice bar ---------- */
  .notice{
    text-align:right;
    font-size:13px;
    color:var(--navy);
    padding:14px 24px;
    border-bottom:1px solid #e9ebf3;
    background:var(--white);
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    background:var(--white);
    border-bottom:1px solid #eef0f8;
  }
  .header-image{
    display:block;
    width:100%;
    height:auto;
  }

  /* ---------- hero ---------- */
  .hero{
    text-align:center;
    padding:52px 20px 30px;
  }
  .hero h1{
    font-size:clamp(22px,4vw,34px);
    margin:0 0 16px;
    color:var(--navy);
    font-weight:800;
    line-height:1.5;
  }
  .hero p{
    margin:0;
    font-size:clamp(15px,2vw,18px);
    color:var(--navy);
    font-weight:500;
  }

  /* ---------- carousel (full-bleed peek style) ---------- */
  .carousel-viewport{
    position:relative;
    width:100%;
    overflow:hidden;
    padding:36px 0 8px;
  }
  .track{
    display:flex;
    direction:ltr;
    gap:14px;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  .card{
    flex:0 0 auto;
    width:min(56vw,270px);
    height:380px;
    border-radius:30px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(160deg,var(--card-a),var(--card-b));
    box-shadow:0 22px 46px -18px rgba(20,25,80,.32);
    cursor:pointer;
    transition:box-shadow .4s;
  }
  .card.is-active{
    box-shadow:0 32px 60px -18px rgba(20,25,80,.42);
  }

  .card-photo-area{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card-photo-area img{
    width:100%;height:100%;object-fit:cover;
  }
  .card-photo-area .upload-placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    color:#8992d6;
    font-size:13px;
    text-align:center;
    padding:20px;
    direction:rtl;
  }
  .card-photo-area .upload-placeholder svg{width:32px;height:32px;opacity:.55;}

  .card-footer{
    position:absolute;
    left:14px;right:14px;bottom:14px;
    z-index:2;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(6px);
    border-radius:20px;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    direction:rtl;
  }
  .chevron-mark{
    color:var(--navy);
    display:flex;
    align-items:center;
  }
  .chevron-mark svg{width:16px;height:16px;}
  .brand-mark{
    width:46px;height:32px;position:relative;
  }
  .brand-mark span{ position:absolute; display:block; }
  .brand-mark .lead{
    width:12px;height:20px;
    background:var(--navy);
    transform:skewX(-18deg);
    left:0; bottom:0;
  }
  .brand-mark .tri-a{
    width:0;height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:22px solid var(--navy);
    right:14px; top:0;
  }
  .brand-mark .tri-b{
    width:0;height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-bottom:22px solid var(--cyan);
    right:0; bottom:0;
  }

  /* dots */
  .dots{
    display:flex;
    justify-content:center;
    gap:9px;
    margin:22px 0 48px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#d6d9ec;
    border:none;
    cursor:pointer;
    padding:0;
    transition:all .3s;
  }
  .dot.active{
    background:var(--navy);
    width:22px;
    border-radius:6px;
  }

  input[type=file]{display:none;}

  @media (max-width:640px){
    .card{width:min(62vw,220px);height:320px;border-radius:22px;}
    .notice{padding:12px 16px;font-size:12px;}
    .nav-btn{width:36px;height:36px;}
  }
</style>
</head>
<body>

  <div class="notice">قواعد الافصاح عن أسعار المنتجات التمويلية</div>

  <header>
    <img src="header.png" alt="الهيدر" class="header-image">
  </header>

  <section class="hero">
    <h1>تجربة مصرفية صُمّمت لك</h1>
    <p>تواكب احتياجات يومك وتدعم طموحات غدك</p>
  </section>

  <div class="carousel-viewport" id="viewport">
    <div class="track" id="track"></div>
  </div>

  <div class="dots" id="dots"></div>

  <input type="file" id="fileInput" accept="image/*">

<script>
  const CARD_COUNT = 5;
  let images = new Array(CARD_COUNT).fill(null);
  let current = 0;
  let activeUploadIndex = null;

  const viewport = document.getElementById('viewport');
  const track = document.getElementById('track');
  const dotsWrap = document.getElementById('dots');
  const fileInput = document.getElementById('fileInput');

  function buildCards(){
    track.innerHTML = '';
    for(let i=0;i<CARD_COUNT;i++){
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = i;

      card.innerHTML = `
        <div class="card-photo-area">
          ${images[i]
            ? `<img src="${images[i]}" alt="بطاقة ${i+1}">`
            : `<div class="upload-placeholder">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
                 اضغط لإضافة صورة
               </div>`
          }
        </div>
        <div class="card-footer">
          <span class="chevron-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </span>
          <div class="brand-mark">
            <span class="lead"></span>
            <span class="tri-a"></span>
            <span class="tri-b"></span>
          </div>
        </div>
      `;

      card.addEventListener('click', ()=>{
        if(parseInt(card.dataset.index) === current){
          activeUploadIndex = i;
          fileInput.click();
        } else {
          goTo(i);
        }
      });

      track.appendChild(card);
    }
    markActive();
    buildDots();
    requestAnimationFrame(updateTransform);
  }

  function markActive(){
    track.querySelectorAll('.card').forEach(c=>{
      c.classList.toggle('is-active', parseInt(c.dataset.index) === current);
    });
  }

  function updateTransform(){
    const cardEl = track.children[current];
    if(!cardEl) return;
    const containerWidth = viewport.clientWidth;
    const cardWidth = cardEl.offsetWidth;
    const cardLeft = cardEl.offsetLeft;
    const offset = (containerWidth/2) - cardLeft - (cardWidth/2);
    track.style.transform = `translateX(${offset}px)`;
  }

  function buildDots(){
    dotsWrap.innerHTML = '';
    for(let i=0;i<CARD_COUNT;i++){
      const dot = document.createElement('button');
      dot.className = 'dot' + (i===current ? ' active':'');
      dot.addEventListener('click', ()=>goTo(i));
      dotsWrap.appendChild(dot);
    }
  }

  function goTo(i){
    current = ((i % CARD_COUNT) + CARD_COUNT) % CARD_COUNT;
    markActive();
    buildDots();
    updateTransform();
  }

  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file || activeUploadIndex === null) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      images[activeUploadIndex] = ev.target.result;
      buildCards();
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  let touchStartX = null;
  viewport.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; });
  viewport.addEventListener('touchend', e=>{
    if(touchStartX===null) return;
    const diff = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(diff) > 40){
      diff > 0 ? goTo(current-1) : goTo(current+1);
    }
    touchStartX = null;
  });

  window.addEventListener('resize', updateTransform);

  buildCards();
</script>
</body>
</html>
